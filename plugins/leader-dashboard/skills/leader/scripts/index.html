<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のリーダー</title>
<style>
/* =====================================================================
   決めごと（見た目を変えるときはここだけ見ればよい）。macOS の標準アプリの作り：
   左にサイドバー、真ん中に一覧（Mail の形）、右に1件。
   色はシステムに従う：Canvas / CanvasText / AccentColor と color-scheme。
   light-dark() はシステムカラーに無いもの（ボタンの地など）だけに使う。
   アクセントの色は「判断待ち」「判断が要る所」「更新（未読の点）」「既定のボタン」だけに使う。
   ===================================================================== */
:root {
  color-scheme: light dark;

  /* ---- 色 ---- */
  --accent: #007aff;                 /* AccentColor が使えないブラウザ向けの控え */
  --accent: AccentColor;             /* Mac のアクセントカラーに従う */
  --accent-text: #fff;
  --accent-text: AccentColorText;
  --bg: light-dark(Canvas, color-mix(in srgb, CanvasText 6%, Canvas)); /* 一覧と詳細の地（ダークは macOS の窓に寄せて少し明るく） */
  --text: CanvasText;                                        /* 本文 */
  --text-2: color-mix(in srgb, CanvasText 64%, Canvas);      /* 補助の字（場所・件数） */
  --text-3: color-mix(in srgb, CanvasText 44%, Canvas);      /* さらに弱い字（時刻・済み） */
  --sidebar-bg: light-dark(color-mix(in srgb, CanvasText 5%, Canvas), color-mix(in srgb, CanvasText 11%, Canvas));
  --separator: color-mix(in srgb, CanvasText 13%, Canvas);   /* 区切りの線 */
  --hover: color-mix(in srgb, CanvasText 5%, transparent);
  --sel-quiet: color-mix(in srgb, CanvasText 11%, transparent); /* サイドバーの選択（一覧に焦点があるとき） */
  --field-bg: light-dark(#fff, color-mix(in srgb, CanvasText 12%, Canvas));
  --field-border: color-mix(in srgb, CanvasText 18%, Canvas);
  --control-bg: light-dark(#fff, color-mix(in srgb, CanvasText 24%, Canvas)); /* 押しボタンの地 */
  --control-border: light-dark(color-mix(in srgb, CanvasText 20%, Canvas), transparent);
  --search-bg: light-dark(color-mix(in srgb, CanvasText 7%, Canvas), color-mix(in srgb, CanvasText 13%, Canvas)); /* ツールバーの入力欄 */
  --diagram-line: color-mix(in srgb, CanvasText 34%, Canvas);
  --fresh: color-mix(in srgb, var(--accent) 16%, transparent); /* 更新した所を開いたときに一度だけ付ける地 */

  /* ---- 字 ---- */
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  --fs-body: 13px;         /* 本文・一覧の題（macOS の標準） */
  --fs-sub: 12px;          /* 一覧の2行目・補助 */
  --fs-small: 11px;        /* サイドバーの節の名前・時刻・図の注 */
  --fs-toolbar: 15px;      /* ツールバーの題 */
  --fs-title: 20px;        /* 詳細の題 */
  --lh: 1.5;
  --lh-tight: 1.35;
  --weight-strong: 600;

  /* ---- 寸法 ---- */
  --sidebar-w: 220px;
  --list-w: 340px;
  --toolbar-h: 52px;
  --row-h: 28px;           /* サイドバーの1行 */
  --pad-x: 16px;           /* サイドバーと一覧の左右 */
  --pad-detail: 28px;      /* 詳細の左右 */
  --gap: 8px;
  --gap-section: 24px;     /* 詳細の節と節の間 */
  --radius-sel: 6px;       /* 選択した行の角 */
  --radius-control: 5px;   /* ボタン・入力欄の角 */
  --measure: 46em;         /* 詳細の文の幅の上限 */
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: var(--fs-body)/var(--lh) var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }
strong, b { font-weight: var(--weight-strong); }
code { font: 0.95em ui-monospace, "SF Mono", Menlo, monospace; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 枠：サイドバー | 一覧 | 詳細 ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) var(--list-w) 1fr;
  grid-template-rows: var(--toolbar-h) 1fr;
  height: 100vh;
}
.sidebar {
  grid-row: 1 / 3;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--separator);
  display: flex; flex-direction: column;
  padding: 0 10px 12px;
  overflow: auto;
}
.toolbar {
  grid-column: 2 / 4;
  display: grid; grid-template-columns: var(--list-w) 1fr;
  border-bottom: 1px solid var(--separator);
}
.tb-list { padding: 9px var(--pad-x) 0; border-right: 1px solid var(--separator); min-width: 0; }
.tb-title { font-size: var(--fs-toolbar); font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { font-size: var(--fs-small); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-detail { display: flex; align-items: center; justify-content: flex-end; gap: var(--gap); padding: 0 var(--pad-detail) 0 var(--pad-x); min-width: 0; }
.latest { flex: 1; min-width: 0; font-size: var(--fs-sub); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; padding: 2px 4px; }
.latest b { color: var(--text); font-weight: var(--weight-strong); margin-right: 6px; }
.latest time { font-variant-numeric: tabular-nums; margin-right: 6px; }
.pj-l { color: var(--text); margin-right: 6px; }
.say-f { display: contents; }
.say {
  width: 300px; height: 28px; padding: 0 10px;
  background: var(--search-bg); border: 1px solid transparent; border-radius: var(--radius-control);
}
.say::placeholder { color: var(--text-3); }
.say:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.list { border-right: 1px solid var(--separator); overflow: auto; }
.detail { overflow: auto; }

/* ---------- サイドバー ---------- */
.sb-top { height: var(--toolbar-h); display: flex; flex-direction: column; justify-content: center; padding: 0 8px; flex: none; }
.sb-app { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-date { font-size: var(--fs-small); color: var(--text-2); }
.sb-head { font-size: var(--fs-small); font-weight: var(--weight-strong); color: var(--text-3); padding: 14px 8px 4px; }
.sb-row {
  display: flex; align-items: center; gap: 7px; width: 100%; flex: none;
  height: var(--row-h); padding: 0 8px; border: 0; background: none; text-align: left;
  border-radius: var(--radius-sel); cursor: default;
}
.sb-row:hover { background: var(--hover); }
.sb-row[aria-current="true"] { background: var(--sel-quiet); }
.sb-row svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
.sb-row .lbl { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row .r { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.sb-row .n { color: var(--text-2); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.sb-sched { list-style: none; margin: 0; padding: 0 8px; }
.sb-sched li { display: grid; grid-template-columns: 76px 1fr; gap: 4px; padding: 3px 0; font-size: var(--fs-sub); line-height: var(--lh-tight); }
.sb-sched time { color: var(--text-2); font-variant-numeric: tabular-nums; }
.sb-sched li.past, .sb-sched li.past time { color: var(--text-3); }
.sb-sched li.now { font-weight: var(--weight-strong); }
.sb-sched li.now time { color: var(--text); }
.sb-foot { margin-top: auto; padding: 12px 8px 0; font-size: var(--fs-small); color: var(--text-3); font-variant-numeric: tabular-nums; }
.sb-foot .pending { color: var(--text); margin-bottom: 6px; }
.sb-foot .keys { margin-bottom: 6px; line-height: 1.6; }
.sb-foot kbd { font: inherit; color: var(--text-2); }

/* ---------- 一覧 ---------- */
.sec {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: baseline; gap: var(--gap);
  padding: 10px var(--pad-x) 4px; background: var(--bg);
  font-weight: 700;
}
.sec .c { margin-left: auto; font-size: var(--fs-small); font-weight: 400; color: var(--text-2); white-space: nowrap; }
.sec button { border: 0; background: none; padding: 0; font-weight: 700; cursor: default; text-align: left; }
.sec button:hover { text-decoration: underline; }
.rows { padding: 0 8px; }
.row {
  display: block; width: 100%; border: 0; background: none; text-align: left;
  padding: 8px 10px 9px; border-radius: var(--radius-sel); cursor: default;
  position: relative;
}
.row + .row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; border-top: 1px solid var(--separator); }
.row:hover { background: var(--hover); }
.row-t { font-weight: var(--weight-strong); line-height: var(--lh-tight); }
.row-p { margin-top: 2px; font-size: var(--fs-sub); color: var(--text-2); line-height: var(--lh-tight);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-m { display: flex; gap: 8px; margin-top: 4px; font-size: var(--fs-small); color: var(--text-3); }
.row-m .st { margin-left: auto; color: var(--text-2); }
.row.decide .row-m .st { color: var(--accent); font-weight: var(--weight-strong); }
.row-m .urg { color: var(--text); font-weight: var(--weight-strong); }
.row.done .row-t { font-weight: 400; color: var(--text-2); }
.row.done .row-m .st { color: var(--text-3); font-weight: 400; }
.row .upd { position: absolute; left: -6px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.row[aria-current="true"] { background: var(--accent); color: var(--accent-text); }
.row[aria-current="true"]::before, .row[aria-current="true"] + .row::before { border-color: transparent; }
.row[aria-current="true"] .row-p, .row[aria-current="true"] .row-m, .row[aria-current="true"] .row-m .st,
.row[aria-current="true"] .row-m .urg, .row[aria-current="true"] .row-t { color: inherit; }
.lead { margin: 0 var(--pad-x) 2px; padding: 10px 0 8px; font-size: var(--fs-sub); color: var(--text-2); line-height: var(--lh-tight); border-bottom: 1px solid var(--separator); }
.lead b { color: var(--text); }
.lead.waiting b { color: var(--accent); }
.lead time { color: var(--text-3); font-variant-numeric: tabular-nums; margin-left: 6px; }

/* 開け閉めの三角（字ではなく線で描く） */
.disc {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px var(--pad-x) 7px calc(var(--pad-x) + 2px); border: 0; background: none; text-align: left;
  color: var(--text-2); font-size: var(--fs-sub); cursor: default;
}
.disc::before {
  content: ""; width: 5px; height: 5px; flex: none;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); margin-right: 2px;
}
.disc[aria-expanded="true"]::before { transform: rotate(45deg) translate(-1px, -1px); }
.disc:hover { color: var(--text); }
.empty { padding: 4px var(--pad-x) 8px calc(var(--pad-x) + 2px); font-size: var(--fs-sub); color: var(--text-3); }

/* ---------- 詳細 ---------- */
.d-wrap { padding: 20px var(--pad-detail) 48px; max-width: calc(var(--measure) + 2 * var(--pad-detail) + 120px); }
.banner { margin: 0 0 16px; padding: 8px 10px; border: 1px solid var(--field-border); border-radius: var(--radius-control); font-size: var(--fs-sub); }
.banner b { margin-right: 8px; }
.d-head { display: flex; align-items: flex-start; gap: 16px; border-radius: var(--radius-sel); }
.d-head > div { flex: 1; min-width: 0; }
.d-meta { font-size: var(--fs-sub); color: var(--text-2); }
.d-meta span + span { margin-left: 10px; }
.d-meta .st { color: var(--text-2); }
.d-meta .st.decide { color: var(--accent); font-weight: var(--weight-strong); }
.d-meta .st.done { color: var(--text-3); }
.d-meta .urg, .d-meta .new { color: var(--text); font-weight: var(--weight-strong); }
.d-meta .new { color: var(--accent); }
.d-title { font-size: var(--fs-title); font-weight: 700; line-height: 1.3; margin: 2px 0 0; letter-spacing: 0.01em; }
.d-sec { margin-top: var(--gap-section); }
.d-label { font-size: var(--fs-body); font-weight: 700; margin: 0 0 6px; }
.d-label small { font-size: var(--fs-sub); font-weight: 400; color: var(--text-2); margin-left: 8px; }
.summary p { margin: 0 0 6px; max-width: var(--measure); }
.more p { margin: 0 0 6px; max-width: var(--measure); color: var(--text-2); }
.d-sec .disc { padding-left: 2px; }

.btn {
  height: 24px; padding: 0 12px; border-radius: var(--radius-control);
  background: var(--control-bg); border: 0.5px solid var(--control-border);
  box-shadow: 0 0.5px 1px color-mix(in srgb, CanvasText 18%, transparent);
  cursor: default; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none; color: var(--text);
}
.btn:active { filter: brightness(0.94); }
.btn.default { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn[disabled] { opacity: 0.45; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: default; font-size: var(--fs-sub); }
.linkbtn:hover { text-decoration: underline; }

/* 問い：macOS のフォームの作法（左に問い、右に選択肢） */
.q { display: grid; grid-template-columns: 200px 1fr; gap: 6px 20px; padding: 14px 0; border-top: 1px solid var(--separator); max-width: calc(var(--measure) + 120px); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-text { font-weight: var(--weight-strong); line-height: var(--lh-tight); padding-top: 2px; }
.q-opts { display: flex; flex-direction: column; gap: 5px; }
.q-opts label { display: flex; gap: 8px; align-items: baseline; }
.q-opts input { accent-color: var(--accent); margin: 0; transform: translateY(1px); }
.q-memo { display: flex; gap: var(--gap); margin-top: 6px; }
.field {
  flex: 1; min-width: 0; height: 24px; padding: 0 8px;
  background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--radius-control);
}
.field::placeholder { color: var(--text-3); }
.q-done { color: var(--text-2); }
.q-done b { color: var(--text); font-weight: var(--weight-strong); }
.q-done .rt { margin-left: 8px; font-size: var(--fs-sub); color: var(--text-3); }
.q-done .rt.wait { color: var(--text); }
.reply { margin-top: 6px; padding: 4px 0; color: var(--text); border-radius: 4px; }
.reply-l { font-weight: var(--weight-strong); margin-right: 6px; }
.q-done .linkbtn { margin-top: 4px; }

/* 下書き */
.draft { padding: 14px 0; border-top: 1px solid var(--separator); max-width: calc(var(--measure) + 120px); }
.draft:first-of-type { border-top: 0; padding-top: 4px; }
.draft-h { display: flex; align-items: baseline; gap: var(--gap); }
.draft-h > div { flex: 1; min-width: 0; }
.draft-l { font-weight: var(--weight-strong); }
.draft-w { font-size: var(--fs-sub); color: var(--text-2); }
.draft-text {
  margin: 8px 0 0; padding: 10px 12px; max-height: 210px; overflow: auto;
  background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--radius-control);
  white-space: pre-wrap; word-break: break-word; font: inherit; line-height: var(--lh);
}
.draft.bad .draft-text { color: var(--text-2); }
.links a { color: var(--accent); text-decoration: none; display: block; padding: 2px 0; }
.links a:hover { text-decoration: underline; }

/* 図（Claude が書いた SVG。class="themed" を付けたものはこの色に合わせる） */
.dg-box { margin-top: 4px; max-width: 760px; }
.dg-box svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--font); }
svg.themed text { fill: var(--text); }
svg.themed .f-you, svg.themed .f-you-ink, svg.themed .f-claude, svg.themed .f-claude-ink { fill: var(--accent); }
svg.themed .f-ink, svg.themed .f-urgent, svg.themed .f-urgent-ink { fill: var(--text); }
svg.themed .f-sub, svg.themed .f-done, svg.themed .f-done-ink, svg.themed .f-run { fill: var(--text-2); }
svg.themed .f-muted { fill: var(--text-3); } svg.themed .f-line { fill: var(--separator); }
svg.themed .f-surface, svg.themed .f-wash, svg.themed .f-you-wash, svg.themed .f-claude-wash, svg.themed .f-done-wash, svg.themed .f-urgent-wash { fill: var(--bg); }
svg.themed .f-on, svg.themed .f-on-you { fill: var(--accent-text); }
svg.themed .s-you, svg.themed .s-claude { stroke: var(--accent); }
svg.themed .s-ink, svg.themed .s-sub, svg.themed .s-done, svg.themed .s-urgent, svg.themed .s-run { stroke: var(--diagram-line); }
svg.themed .s-muted, svg.themed .s-line { stroke: var(--separator); }
.dg-box.paper { padding: 10px 12px; background: #fff; border: 1px solid var(--separator); border-radius: var(--radius-control); color-scheme: light; }

/* 全体：判断待ちの数・プロジェクトごとの数・Claude の動き */
.overview-counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, max-content)); gap: 10px 28px; margin-top: 12px; align-items: start; }
.ov-p { display: flex; flex-direction: column; align-self: start; border: 0; background: none; padding: 0; text-align: left; cursor: default; font-size: var(--fs-sub); color: var(--text-2); max-width: 260px; }
.ov-p b { display: flex; align-items: center; gap: 6px; font-size: var(--fs-body); color: var(--text); font-weight: var(--weight-strong); }
.ov-p:hover b { text-decoration: underline; }
.ov-p .lead-s { display: block; margin-top: 2px; color: var(--text-3); line-height: var(--lh-tight); }
.ov-p .lead-s em { font-style: normal; color: var(--text-2); }
.ov-p .lead-s.waiting em { color: var(--accent); font-weight: var(--weight-strong); }
.log { list-style: none; margin: 0; padding: 0; max-width: calc(var(--measure) + 80px); }
.log li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--separator); position: relative; border-radius: 4px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--text-3); font-variant-numeric: tabular-nums; }
.log li.strong p { font-weight: var(--weight-strong); }
.log li.unread::before { content: ""; position: absolute; left: -14px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.log p { margin: 0; overflow-wrap: anywhere; }
.log .rt { margin-left: 8px; font-size: var(--fs-sub); color: var(--text-3); }
.log .rt.wait { color: var(--text); }

/* 開いたときに一度だけ、更新した所に地を付けて消す。ツールバーの最新の動きも同じ */
@keyframes fresh { from { background-color: var(--fresh); } to { background-color: transparent; } }
.fresh { animation: fresh 2.6s ease-out; }

/* 知らせ（右下）。押すもの（元に戻す）があるときだけ触れる */
.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 20; max-width: 460px;
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: var(--control-bg); border: 0.5px solid var(--field-border); border-radius: 8px;
  box-shadow: 0 6px 20px color-mix(in srgb, CanvasText 18%, transparent);
  font-size: var(--fs-sub); opacity: 0; transform: translateY(4px); transition: opacity 120ms, transform 120ms; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.act { pointer-events: auto; }
.toast b { font-weight: var(--weight-strong); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .sidebar { padding-bottom: 8px; }
  .toolbar { display: block; }
  .tb-list { border-right: 0; padding-bottom: 8px; }
  .tb-detail { padding: 8px var(--pad-x); flex-wrap: wrap; }
  .say { width: auto; flex: 1; }
  .list { border-right: 0; max-height: 50vh; }
  .q { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .disc::before { transition: transform 120ms ease-out; }
}
@media (prefers-reduced-motion: reduce) {
  .fresh { animation: none; }
  .toast { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="プロジェクト"></nav>
  <header class="toolbar">
    <div class="tb-list"><div class="tb-title" id="tbTitle"></div><div class="tb-sub" id="tbSub"></div></div>
    <div class="tb-detail">
      <div class="latest" id="tick"></div>
      <form class="say-f" id="gform"><input class="say" id="gmsg" type="text" placeholder="Claude に一言（どのタブからでも）" aria-label="Claude に一言" autocomplete="off"><button class="btn" type="submit">送る</button></form>
    </div>
  </header>
  <section class="list" id="list" aria-label="項目"></section>
  <main class="detail" id="detail"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const DEFAULT_TITLE = "今日のリーダー";
const ui = { sel: {}, note: {}, open: {}, more: {}, reans: {} };   // 選んだ答え・メモ・済みの開け閉め・くわしく・答え直し
let lastJson = "", state = null, prevLogN = null, lastView = "";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
const plain = s => String(s ?? "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
let toastTimer;
function toast(html, ms = 1800) { const el = $("#toast"); el.innerHTML = html; el.classList.remove("act"); el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms); }
async function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

// ---------- 項目の状態（status はサーバーが決める。問いが全部答えられていれば回答済みとして見せる） ----------
function itemState(it) {
  if (it.status === "done" || it.status === "running") return it.status;
  const qs = it.questions || [];
  if (qs.length && qs.every(q => q.answer)) return "answered";
  return "decide";
}
const STATES = ["decide", "answered", "running", "done"];
const LABEL = { decide: "判断待ち", answered: "回答済み", running: "進行中", done: "済み" };
function countStates(list) { const c = { decide: 0, answered: 0, running: 0, done: 0 }; list.forEach(i => c[itemState(i)]++); return c; }
const rank = it => ({ decide: it.urgent ? 0 : 1, answered: 2, running: 3, done: 4 }[itemState(it)]);
const sortItems = list => list.map((it, k) => ({ it, k })).sort((a, b) => rank(a.it) - rank(b.it) || a.k - b.k).map(x => x.it);
const itemNo = it => it.no && it.no !== "—" ? it.no : "";
const counted = c => [c.decide ? `判断待ち ${c.decide}` : "", c.answered ? `回答済み ${c.answered}` : "", c.running ? `進行中 ${c.running}` : "", `済み ${c.done}`].filter(Boolean).join("、");

// ---------- 時刻（"2026-11-19 14:05:12" や "11/19 14:05" や "14:05" の末尾の時:分を読む） ----------
function hm(ts) {
  const m = String(ts ?? "").match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*$/);
  return m ? { min: +m[1] * 60 + +m[2], text: m[1].padStart(2, "0") + ":" + m[2] } : null;
}
const hmText = ts => hm(ts)?.text || String(ts ?? "");
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function dateText() { const d = new Date(); return `${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`; }

// ---------- 既読（Claude の更新を見たか。localStorage に作業フォルダーごとに覚える） ----------
let seen = null, seenKey = null;
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
// 利用者自身の答えは入れない（Claude の側の変化だけ）。利用者の「完了」による status の変化は poll で既読に合わせる
function sig(it) { return hash(JSON.stringify([it.status, it.title, it.summary, (it.questions || []).map(q => [q.text, q.reply || ""]), (it.drafts || []).map(d => d.text)])); }
function saveSeen() { try { localStorage.setItem(seenKey, JSON.stringify(seen)); } catch (e) { /* 覚えられなくても動く */ } }
function loadSeen(j) {
  seenKey = j.session ? "leader-seen-v1:" + j.session : "leader-seen-v1";
  try { seen = JSON.parse(localStorage.getItem(seenKey) || "null"); } catch (e) { seen = null; }
  // 初めて開いたときは、今ある内容を全部「見た」ことにする
  if (!seen || typeof seen.items !== "object") { seen = { items: Object.fromEntries(j.items.map(it => [it.id, sig(it)])), logN: (j.log || []).length }; saveSeen(); }
}
function isUpdated(it) { return !!seen && seen.items[it.id] !== sig(it); }
function markSeen(it) { if (seen && seen.items[it.id] !== sig(it)) { seen.items[it.id] = sig(it); saveSeen(); } }
function unreadLog() { return seen ? Math.max(0, (state.log || []).length - seen.logN) : 0; }

// ---------- 場所（#サイドバーの項目/一覧の項目） ----------
function route() {
  const [tab, item] = location.hash.slice(1).split("/").map(x => decodeURIComponent(x || ""));
  const t = state && state.projects.some(p => p.id === tab) ? tab : "overview";
  return { tab: t, item: item || null };
}
function go(tab, item) { location.hash = item ? `${encodeURIComponent(tab)}/${encodeURIComponent(item)}` : encodeURIComponent(tab); }
window.addEventListener("hashchange", () => state && render());
const tabsOrder = () => ["overview", ...state.projects.map(p => p.id)];

function itemsOf(pj) { return state.items.filter(i => i.project === pj); }
const isDone = it => itemState(it) === "done";
// 一覧の順（判断待ち・急ぎが先）。j/k も次の判断待ちもこの順
function activeOrder(pj) { return sortItems(itemsOf(pj).filter(i => !isDone(i))); }
function doneOrder(pj) { return itemsOf(pj).filter(isDone); }
// j/k の順番。「済み」を畳んでいる間は済みを飛ばす
function navOrder(pj) { const a = activeOrder(pj); return ui.open[pj] || !a.length ? a.concat(doneOrder(pj)) : a; }
// 開いている項目（指定が無ければ最初の判断待ち、無ければ残りの先頭、それも無ければ済みの先頭）
function currentOf(pj, itemId) {
  const act = activeOrder(pj);
  return itemsOf(pj).find(i => i.id === itemId) || act.find(i => itemState(i) === "decide") || act[0] || doneOrder(pj)[0];
}
// cur の後ろ（無ければ先頭から）の、次の判断待ち。act は cur がまだ並んでいたときの順番
function nextDecide(act, cur) { return act.slice(act.indexOf(cur) + 1).concat(act).find(i => i.id !== cur.id && itemState(i) === "decide"); }

// 答えと一言を Claude が受け取ったか（routed がある server のときだけ出す）
const routedMark = d => d && typeof d.routed === "boolean" ? (d.routed ? `<span class="rt">受け取り済み</span>` : `<span class="rt wait">Claude が未処理</span>`) : "";
// 動いたことを書いた担当のプロジェクト（log[].project があるときだけ）
const logProj = l => { if (!l || !l.project) return ""; const p = state.projects.find(x => x.id === l.project); return `<span class="pj-l">${esc(p ? p.label : l.project)}</span>`; };
// プロジェクトの担当エージェント（projects[].lead。無ければ何も出さない）
const LEAD = { working: "作業中", idle: "待機", waiting: "答え待ち" };
function leadParts(p) {
  const l = p && p.lead; if (!l || typeof l !== "object") return null;
  const st = LEAD[l.status] ? l.status : "idle";
  return { st, word: LEAD[st], at: hm(l.updated)?.text || "", sum: String(l.summary || "") };
}

const ICON = {
  tray: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9.5 3.8 3h8.4L14 9.5V13H2z"/><path d="M2 9.5h3.5l1 1.5h3l1-1.5H14"/></svg>',
  folder: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4.2c0-.6.4-1 1-1h3.4l1.4 1.5h5.6c.6 0 1 .4 1 1v6.6c0 .6-.4 1-1 1H2.8c-.6 0-1-.4-1-1z"/><path d="M1.8 6.4h12.4"/></svg>',
};

// ---------- サイドバー ----------
function schedHtml() {
  const now = nowMin();
  return (state.schedule || []).map(x => {
    const a = hm(x.time), b = hm(x.end), am = a ? a.min : null, bm = b ? b.min : am != null ? am + 30 : null;
    const cls = am == null ? "" : now >= bm ? "past" : now >= am ? "now" : "";
    return `<li class="${cls}"><time>${esc(x.time || "")}${x.end ? "–" + esc(x.end) : ""}</time><span>${esc(x.title || "")}</span></li>`;
  }).join("");
}
function sidebarHtml(r) {
  const s = state;
  const row = (id, label, icon, n, upd, updWord) =>
    `<button class="sb-row" type="button" data-go="${esc(id)}" aria-current="${r.tab === id}">${icon}<span class="lbl">${esc(label)}</span><span class="r">` +
    (upd ? `<span class="dot" title="${updWord} ${upd}"></span><span class="vh">${updWord} ${upd}</span>` : "") +
    (n ? `<span class="n" title="判断待ち ${n} 件">${n}</span>` : "") + `</span></button>`;
  const pending = s.routing && +s.routing.pending > 0 ? `<div class="pending" title="送った答えと一言のうち、Claude がまだ受け取っていない件数">Claude が未処理 ${+s.routing.pending} 件</div>` : "";
  return `<div class="sb-top"><div class="sb-app" id="title">${esc(titleText())}</div><div class="sb-date">${dateText()}</div></div>` +
    row("overview", "全体", ICON.tray, countStates(s.items).decide, unreadLog(), "新着") +
    `<div class="sb-head">プロジェクト</div>` +
    s.projects.map(p => row(p.id, p.label, ICON.folder, countStates(itemsOf(p.id)).decide, itemsOf(p.id).filter(isUpdated).length, "更新")).join("") +
    ((s.schedule || []).length ? `<div class="sb-head">今日の予定</div><ul class="sb-sched" id="sched">${schedHtml()}</ul>` : "") +
    `<div class="sb-foot">${pending}<div class="keys"><kbd>j</kbd> <kbd>k</kbd> 一覧を移る　<kbd>x</kbd> 完了<br><kbd>←</kbd> <kbd>→</kbd> か <kbd>⌘1</kbd>〜 で切り替え</div><div id="gen">${esc(genText)}</div></div>`;
}

// ---------- 一覧 ----------
function rowHtml(it, curId) {
  const st = itemState(it), up = isUpdated(it);
  const meta = [itemNo(it), it.group].filter(Boolean).join("　");
  return `<button class="row ${st} ${up ? "up" : ""}" type="button" data-tab="${esc(it.project)}" data-item="${esc(it.id)}" aria-current="${curId === it.id}">` +
    (up ? `<span class="upd" title="Claude が更新"><span class="vh">更新</span></span>` : "") +
    `<div class="row-t">${esc(it.title)}</div>` +
    ((it.summary || [])[0] ? `<div class="row-p">${esc(plain(it.summary[0]))}</div>` : "") +
    `<div class="row-m"><span>${esc(meta)}</span>${it.urgent && st !== "done" ? '<span class="urg">急ぎ</span>' : ""}<span class="st">${LABEL[st]}</span></div></button>`;
}
function leadBlock(p) {
  const l = leadParts(p); if (!l) return "";
  return `<div class="lead ${l.st}">担当は<b>${l.word}</b>${l.at ? `<time>${esc(l.at)}</time>` : ""}${l.sum ? `<br>${esc(l.sum)}` : ""}</div>`;
}
function groupHtml(pj, curId, overview) {
  const p = state.projects.find(x => x.id === pj), its = itemsOf(pj), c = countStates(its);
  const live = activeOrder(pj), done = doneOrder(pj);
  let h = "";
  if (overview) h += `<div class="sec"><button type="button" data-go="${esc(pj)}">${esc(p.label)}</button><span class="c">${counted(c)}</span></div>`;
  else {
    h += leadBlock(p);
    if (live.length) h += `<div class="sec"><span>${live.every(i => itemState(i) === "decide") ? "判断待ち" : "残り"}</span><span class="c">${live.every(i => itemState(i) === "decide") ? `${c.decide} 件` : counted({ ...c, done: 0 }).replace(/、済み 0$/, "")}</span></div>`;
  }
  if (live.length) h += `<div class="rows">${live.map(it => rowHtml(it, curId)).join("")}</div>`;
  else if (!overview) h += `<div class="empty">判断待ちはありません</div>`;
  if (done.length) {
    const open = !!ui.open[pj];
    h += `<button class="disc" type="button" data-toggle="${esc(pj)}" aria-expanded="${open}">済み ${done.length} 件</button>`;
    if (open) h += `<div class="rows">${done.map(it => rowHtml(it, curId)).join("")}</div>`;
  }
  return h;
}

// ---------- 詳細：1件 ----------
const DIAGRAMS = {};   // 画面に組み込みの図（名前 → { label, svg() }）。items の "diagram" で呼ぶ
function questionHtml(it, q, st) {
  const answered = !!q.answer, reans = !!ui.reans[q.id];
  let right = "";
  if (answered) {
    const a = [q.answer.choice, q.answer.note].filter(Boolean).join("／");
    right += `<div class="q-done"><b>${esc(a)}</b>（${esc(hmText(q.answer.ts))}）${routedMark(q.answer)}`;
    if (q.reply) right += `<div class="reply" data-reply><span class="reply-l">Claude</span>${md(q.reply)}</div>`;
    if (st !== "done") right += `<div><button class="linkbtn" type="button" data-reans="${esc(q.id)}">${reans ? "答え直すのをやめる" : "答え直す"}</button></div>`;
    right += `</div>`;
  } else if (q.reply) right += `<div class="reply" data-reply><span class="reply-l">Claude</span>${md(q.reply)}</div>`;
  if (st !== "done" && (!answered || reans)) {  // 済みの項目では選択肢と入力欄を出さない
    const sel = ui.sel[q.id] ?? null, name = `q-${q.id}`;
    right += (q.options.length ? `<div class="q-opts" role="radiogroup" aria-label="${esc(plain(q.text))}">` +
      q.options.map(o => `<label><input type="radio" name="${esc(name)}" data-q="${esc(q.id)}" value="${esc(o)}" ${sel === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("") + `</div>` : "") +
      `<div class="q-memo"><input class="field" type="text" data-note="${esc(q.id)}" value="${esc(ui.note[q.id] || "")}" placeholder="メモ（任意）" aria-label="メモ" autocomplete="off">` +
      `<button class="btn default" type="button" data-answer="${esc(q.id)}" ${sel || (ui.note[q.id] || "").trim() ? "" : "disabled"}>答える</button></div>`;
  }
  return `<div class="q" data-qid="${esc(q.id)}"><div class="q-text">${md(q.text)}</div><div>${right}</div></div>`;
}
function itemHtml(it, fresh) {
  const st = itemState(it), p = state.projects.find(x => x.id === it.project);
  const meta = [itemNo(it), it.group, p ? p.label : ""].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("") +
    `<span class="st ${st}">${LABEL[st]}</span>${it.urgent && st !== "done" ? '<span class="urg">急ぎ</span>' : ""}${fresh ? '<span class="new">更新</span>' : ""}`;
  const btn = st === "done" ? `<button class="btn" type="button" id="donebtn" data-done="0">未完了に戻す</button>` : `<button class="btn" type="button" id="donebtn" data-done="1">完了にする</button>`;
  let h = `<div class="d-head ${fresh ? "fresh" : ""}"><div><div class="d-meta">${meta}</div><h1 class="d-title">${esc(it.title)}</h1></div>${btn}</div>`;
  if ((it.summary || []).length || (it.details || []).length) {
    h += `<div class="d-sec summary"><h2 class="d-label">要約</h2>${(it.summary || []).map(x => `<p>${md(x)}</p>`).join("")}`;
    if ((it.details || []).length) {
      const open = !!ui.more[it.id];
      h += `<button class="disc" type="button" data-more="${esc(it.id)}" aria-expanded="${open}">くわしく（${it.details.length} 件）</button>`;
      if (open) h += `<div class="more">${it.details.map(x => `<p>${md(x)}</p>`).join("")}</div>`;
    }
    h += `</div>`;
  }
  const dg = it.diagram && DIAGRAMS[it.diagram];
  if (dg) h += `<div class="d-sec"><h2 class="d-label">${esc(dg.label)}</h2><div class="dg-box">${dg.svg()}</div></div>`;
  // 色を class で付けた図（class="themed"）は画面の色に合わせ、そうでない図は明るい紙の上に出す
  if (it.svg) h += `<div class="d-sec"><h2 class="d-label">図</h2><div class="dg-box ${/^\s*<svg[^>]*\bclass=["'][^"']*\bthemed\b/i.test(it.svg) ? "" : "paper"}">${it.svg}</div></div>`;
  const qs = it.questions || [];
  if (qs.length) {
    const left = qs.filter(q => !q.answer).length;
    h += `<div class="d-sec"><h2 class="d-label">問い<small>${left ? `残り ${left} 件` : "すべて答えた"}</small></h2>${qs.map(q => questionHtml(it, q, st)).join("")}</div>`;
  }
  if ((it.drafts || []).length) h += `<div class="d-sec"><h2 class="d-label">下書き<small>${it.drafts.length} 件</small></h2>${it.drafts.map((d, k) =>
    `<div class="draft ${d.error ? "bad" : ""}"><div class="draft-h"><div><div class="draft-l">${esc(d.label)}</div><div class="draft-w">${esc(d.where || "")}</div></div>` +
    (d.link ? `<a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">開く</a>` : "") +
    `<button class="btn" type="button" data-copy="${k}">コピー</button></div><pre class="draft-text">${esc(d.text)}</pre></div>`).join("")}</div>`;
  if ((it.links || []).length) h += `<div class="d-sec links"><h2 class="d-label">リンク</h2>${it.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("")}</div>`;
  return h;
}

// ---------- 詳細：全体 ----------
function overviewHtml() {
  const s = state, c = countStates(s.items), u = unreadLog();
  const L = s.log || [], logs = L.map((l, i) => ({ ...l, i, unread: u && i >= L.length - u })).sort((a, b) => String(b.ts).localeCompare(String(a.ts)) || b.i - a.i);
  const cols = s.projects.map(p => {
    const k = countStates(itemsOf(p.id)), up = itemsOf(p.id).filter(isUpdated).length, l = leadParts(p);
    return `<button class="ov-p" type="button" data-go="${esc(p.id)}"><b>${esc(p.label)}${up ? `<span class="dot" title="更新 ${up}"></span>` : ""}</b>判断待ち ${k.decide}、済み ${k.done}` +
      (l ? `<span class="lead-s ${l.st}">担当は<em>${l.word}</em>${l.at ? `（${esc(l.at)}）` : ""}${l.sum ? `　${esc(l.sum)}` : ""}</span>` : "") + `</button>`;
  }).join("");
  let h = `<h1 class="d-title">${c.decide ? `判断待ちは ${c.decide} 件です` : "判断待ちはありません"}</h1>`;
  if (s.headline) h += `<p class="d-meta" style="margin:4px 0 0">${md(s.headline)}</p>`;
  h += `<div class="overview-counts">${cols}</div>`;
  h += `<div class="d-sec"><h2 class="d-label">Claude の動き<small>新しい順</small></h2>` + (logs.length ? `<ul class="log" id="feed">` +
    logs.map((l, k) => `<li class="${l.unread ? "unread strong" : (!u && k === 0 ? "strong" : "")}"><time>${esc(hmText(l.ts))}</time><p>${logProj(l)}${md(l.text)}</p></li>`).join("") + `</ul>` : `<p class="d-meta">まだありません</p>`) + `</div>`;
  const msgs = (s.messages || []).slice().reverse();
  h += `<div class="d-sec"><h2 class="d-label">送ったメモ<small>${msgs.length ? `${msgs.length} 件` : ""}</small></h2>` + (msgs.length ? `<ul class="log">` +
    msgs.map(m => `<li><time>${esc(hmText(m.ts))}</time><p>${esc(m.note)}${routedMark(m)}</p></li>`).join("") + `</ul>` : `<p class="d-meta">一言はツールバーの欄から、どこからでも送れます</p>`) + `</div>`;
  return h;
}

// ---------- 描画 ----------
let genText = "";
function unreadTotal() { return state.items.filter(isUpdated).length + unreadLog(); }
function titleText() { return state.title || DEFAULT_TITLE; }
function setTitle() { const u = unreadTotal(); document.title = (u ? `(${u}) ` : "") + titleText(); }

function render() {
  const s = state, r = route();
  $("#sidebar").innerHTML = sidebarHtml(r);
  const last = (s.log || [])[(s.log || []).length - 1];
  $("#tick").innerHTML = last ? `<b>Claude</b><time>${esc(hmText(last.ts))}</time>${logProj(last)}${esc(plain(last.text))}` : "";
  $("#tick").title = last ? plain(last.text) : "";
  const banners = (s.errors || []).map(e => `<div class="banner"><b>エラー</b>${esc(e)}</div>`).join("") + (s.warnings || []).map(e => `<div class="banner"><b>注意</b>${esc(e)}</div>`).join("");
  const list = $("#list"), detail = $("#detail");
  let view, curId = null, fresh = false, cur = null;
  if (r.tab === "overview") {
    view = "overview";
    const c = countStates(s.items);
    $("#tbTitle").textContent = "全体";
    $("#tbSub").textContent = `判断待ち ${c.decide} 件、済み ${c.done} 件`;
  } else {
    const p = s.projects.find(x => x.id === r.tab), c = countStates(itemsOf(r.tab));
    cur = currentOf(r.tab, r.item);
    if (cur && isDone(cur)) ui.open[r.tab] = true;
    curId = cur ? cur.id : null;
    fresh = !!cur && isUpdated(cur);
    view = `${r.tab}/${curId}`;
    $("#tbTitle").textContent = p.label;
    $("#tbSub").textContent = `判断待ち ${c.decide} 件、済み ${c.done} 件`;
  }
  // 同じ所を描き直すときは、一覧と詳細のスクロールの位置を保つ
  const keep = view === lastView, ly = list.scrollTop, dy = detail.scrollTop;
  list.innerHTML = r.tab === "overview" ? s.projects.map(p => groupHtml(p.id, null, true)).join("") : groupHtml(r.tab, curId, false);
  detail.innerHTML = `<div class="d-wrap">${banners}${r.tab === "overview" ? overviewHtml() : cur ? itemHtml(cur, fresh) : `<p class="d-meta">項目はありません</p>`}</div>`;
  detail.dataset.cur = curId || "";
  if (keep) { list.scrollTop = ly; detail.scrollTop = dy; }
  else { detail.scrollTop = 0; const on = $(".row[aria-current=true]", list); if (on) on.scrollIntoView({ block: "nearest" }); }
  lastView = view;
  if (fresh) { markSeen(cur); $$("[data-reply]").forEach(x => x.classList.add("fresh")); rerenderLater(); }
  if (r.tab === "overview" && unreadLog() && seen) { seen.logN = (s.log || []).length; saveSeen(); rerenderLater(); }
  setTitle();
}
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

// 付けた印（更新・新着）を消すための描き直し（入力中は描き直さない）。前の予約は取り消す（開いたばかりの印を途中で消さない）
let rerenderTimer;
function rerenderLater() {
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => { if (state && !typing()) render(); }, 3200);
}
// 時刻が進んだら予定の印だけを直す（全体は描き直さない）
setInterval(() => { const el = $("#sched"); if (el && state) el.innerHTML = schedHtml(); }, 30000);

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

// ---------- 完了（利用者が項目を済みにする・未完了に戻す） ----------
// 送ったらすぐ見た目を変え、開いていた項目なら次の判断待ちへ進む。知らせから元に戻せる
async function setDone(id, done) {
  const it = state && state.items.find(i => i.id === id); if (!it) return false;
  const r = await post("/api/done", { item: id, done });
  if (!r.ok) { toast(r.status === 404 ? "この項目はもう無い（Claude が消したか、名前が変わった）" : "送れなかった"); return false; }
  const pj = it.project, act = activeOrder(pj), r0 = route(), wasCur = r0.tab === pj && currentOf(pj, r0.item)?.id === id;
  const wasSeen = seen && seen.items[id] === sig(it);
  it.status = done ? "done" : (it.status === "done" ? "decide" : it.status);
  it.user_done = { ts: "", item: id, done };
  if (wasSeen) markSeen(it);  // 自分の操作で「更新」の印を付けない
  lastJson = "";
  if (done) {
    const el = $("#toast");
    el.innerHTML = `<span><b>完了にした</b>　${esc(it.title)}</span><button class="btn" type="button" id="undo">元に戻す</button>`;
    el.classList.add("show", "act"); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show", "act"), 6000);
    $("#undo").onclick = async () => { el.classList.remove("show", "act"); if (await setDone(id, false)) go(pj, id); };
    const nxt = wasCur ? nextDecide(act, it) : null;
    if (nxt) go(pj, nxt.id); else render();
  } else { toast("未完了に戻した"); render(); }
  poll();
  return true;
}

// ---------- 答える ----------
async function answer(qid) {
  const r0 = route(), cur = r0.tab !== "overview" ? currentOf(r0.tab, r0.item) : null;
  if (!cur) return;
  const btn = $(`[data-answer="${CSS.escape(qid)}"]`); if (btn) btn.disabled = true;
  const r = await post("/api/decision", { qid, choice: ui.sel[qid] || "", note: ui.note[qid] || "" });
  if (!r.ok) { toast("送れなかった"); if (btn) btn.disabled = false; return; }
  ui.sel[qid] = null; ui.note[qid] = ""; ui.reans[qid] = false;
  if (document.activeElement) document.activeElement.blur();
  toast("Claude に送った");
  // この件の問いが全部答えられたら、次の判断待ちへ進む
  const left = (cur.questions || []).filter(q => q.id !== qid && !q.answer);
  lastJson = "";
  if (!left.length) { const nxt = nextDecide(activeOrder(cur.project), cur); if (nxt) go(cur.project, nxt.id); }
  poll();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-item],[data-toggle],[data-more],[data-copy],[data-done],[data-answer],[data-reans]");
  if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.item) { const it = state.items.find(i => i.id === t.dataset.item); if (it && isDone(it)) ui.open[it.project] = true; go(t.dataset.tab, t.dataset.item); }
  else if (t.dataset.toggle) { ui.open[t.dataset.toggle] = !ui.open[t.dataset.toggle]; render(); }
  else if (t.dataset.more) { ui.more[t.dataset.more] = !ui.more[t.dataset.more]; render(); }
  else if (t.dataset.reans) { ui.reans[t.dataset.reans] = !ui.reans[t.dataset.reans]; render(); }
  else if (t.dataset.copy !== undefined) {
    const it = state.items.find(i => i.id === $("#detail").dataset.cur), d = it && (it.drafts || [])[+t.dataset.copy];
    if (!d) return;
    const ok = await copyText(d.text);
    t.textContent = ok ? "コピーしました" : "コピーできなかった"; toast(ok ? "コピーした" : "コピーできなかった");
    setTimeout(() => (t.textContent = "コピー"), 1500);
  }
  else if (t.dataset.done !== undefined) setDone($("#detail").dataset.cur, t.dataset.done === "1");
  else if (t.dataset.answer) answer(t.dataset.answer);
});
// 選択肢とメモ（描き直しても残るように ui に覚える）
document.addEventListener("change", e => {
  const t = e.target; if (!t.matches("input[type=radio][data-q]")) return;
  ui.sel[t.dataset.q] = t.value;
  const b = $(`[data-answer="${CSS.escape(t.dataset.q)}"]`); if (b) b.disabled = false;
});
document.addEventListener("input", e => {
  const t = e.target; if (!t.matches("[data-note]")) return;
  const qid = t.dataset.note; ui.note[qid] = t.value;
  const b = $(`[data-answer="${CSS.escape(qid)}"]`); if (b) b.disabled = !(ui.sel[qid] || t.value.trim());
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-note]")) { const b = $(`[data-answer="${CSS.escape(e.target.dataset.note)}"]`); if (b && !b.disabled) { e.preventDefault(); answer(e.target.dataset.note); } }
});

// どこからでも送れる一言。頭に「［プロジェクト / 項目］」を付ける
$("#gform").onsubmit = async e => {
  e.preventDefault();
  const inp = $("#gmsg"), text = inp.value.trim(); if (!text || !state) return;
  const r = route(), pj = state.projects.find(p => p.id === r.tab);
  const it = pj ? (state.items.find(i => i.id === r.item) || currentOf(pj.id, null)) : null;
  const where = pj ? `［${pj.label}${it ? " / " + it.title : ""}］ ` : "";
  const res = await post("/api/message", { text: where + text, item: it ? it.id : "" });
  if (res.ok) { inp.value = ""; toast("Claude に送った"); lastJson = ""; poll(); } else toast("送れなかった");
};

// キー：←→ か ⌘1〜9（1〜9 だけでも）でサイドバー、j/k・↑↓ で一覧、x で完了。入力中は効かない
document.addEventListener("keydown", e => {
  if (!state || e.ctrlKey || e.altKey || ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName)) return;
  const r = route(), tabs = tabsOrder(), ti = Math.max(0, tabs.indexOf(r.tab));
  if (/^[1-9]$/.test(e.key)) { const t = tabs[+e.key - 1]; if (t) { e.preventDefault(); go(t); } return; }
  if (e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "l") { e.preventDefault(); go(tabs[(ti + 1) % tabs.length]); return; }
  if (e.key === "ArrowLeft" || e.key === "h") { e.preventDefault(); go(tabs[(ti - 1 + tabs.length) % tabs.length]); return; }
  if (r.tab === "overview") return;
  if (e.key === "x") { const cur = currentOf(r.tab, r.item); if (cur && !isDone(cur)) { e.preventDefault(); setDone(cur.id, true); } return; }
  const order = navOrder(r.tab); if (!order.length) return;
  const i = Math.max(0, order.indexOf(currentOf(r.tab, r.item)));
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(r.tab, order[Math.min(order.length - 1, i + 1)].id); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(r.tab, order[Math.max(0, i - 1)].id); }
});

// 項目の欄に書いている間は描き直さない（ツールバーの一言の欄は描き直しの外なので数えない）
function typing() { return !!document.activeElement?.matches?.("#detail input[type=text], #detail textarea"); }

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const txt = await r.text(), j = JSON.parse(txt);
    if (j.error) { $("#detail").innerHTML = `<div class="d-wrap"><div class="banner"><b>サーバーのエラー</b>${esc(j.error)}</div></div>`; return; }
    genText = "更新 " + ((String(j.generated).match(/\d{1,2}:\d{2}(:\d{2})?\s*$/) || [j.generated])[0]);
    const g = $("#gen"); if (g) g.textContent = genText;
    if (!seen) loadSeen(j);
    // Claude が「動いたこと」を書いたら、知らせとツールバーで知らせる
    const ln = (j.log || []).length;
    let newLog = false;
    if (prevLogN !== null && ln > prevLogN) { const l = j.log[ln - 1], p = l.project && (j.projects || []).find(x => x.id === l.project); toast(`<span><b>Claude</b>　${p ? esc(p.label) + "　" : ""}${md(l.text)}</span>`, 5000); newLog = true; }
    prevLogN = ln;
    const cmp = txt.replace(/"generated":\s*"[^"]*"/, "");  // 時刻だけが変わったときは描き直さない
    if (cmp !== lastJson && !typing()) {
      // 利用者自身の「完了」「未完了に戻す」で status が変わっても、「更新」の印は付けない
      if (state && seen) for (const it of j.items) {
        const old = state.items.find(o => o.id === it.id);
        if (old && JSON.stringify(old.user_done?.done ?? null) !== JSON.stringify(it.user_done?.done ?? null) && seen.items[it.id] === sig(old)) { seen.items[it.id] = sig(it); saveSeen(); }
      }
      lastJson = cmp; state = j;
      render();
    }
    if (newLog) { const t = $("#tick"); if (t) { t.classList.remove("fresh"); void t.offsetWidth; t.classList.add("fresh"); } }
  } catch (e) { const g = $("#gen"); if (g) g.textContent = "サーバーにつながらない"; }
}
poll(); setInterval(poll, 4000);
</script>
</body>
</html>
